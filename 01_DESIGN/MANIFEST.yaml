locked_decisions:
  - class_system_tank_archer_mage_hybrid
  - ttk_window: '20-30 seconds'
  - wheels_Q_E_radial
  - no_default_iframe_roll
  - no_shift_sprint
  - m1_basic_or_primed_ability_fire
  - m2_is_parry
  - old_mastery_runtime_pending_class_redesign
  - no_pentagon_counter_between_elements
  - auto_swap_on_direct_ability_cast
  - wheel_release_primes_lmb_fires
  - all_weapons_airborne_target
  - no_fall_damage_target
  - no_self_ability_damage_target
  - no_fixed_transfers_target_recovery_utility_sustain
  - no_season_pass
  - 1v1_and_team_modes_at_launch
  - quest_based_permanent_unlocks
  - small_talent_tree
  - mini_malus_on_every_ability
  - visual_style: 'low-poly stylized (Risk of Rain 2 direction)'
  - asset_source_priority: [local_runtime_inventory, coherent_free_external_candidates]

