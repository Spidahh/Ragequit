[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
; SENZA THREAD, e deliberatamente.
;
; Il template con i thread richiede che il server mandi gli header
; Cross-Origin-Opener-Policy / Cross-Origin-Embedder-Policy per abilitare
; SharedArrayBuffer. Su itch.io quegli header non li controlli tu, quindi un
; build con i thread lì semplicemente non parte. Il nothreads gira ovunque.
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)

[preset.1]

; Il SERVER DEDICATO: lo stesso progetto, esportato senza finestra.
;
; `dedicated_server=true` non e' un'etichetta: dice a Godot di lasciare fuori
; texture, suoni e mesh dall'esportato. Il server non disegna niente e non
; suona niente, e portarsi dietro 13 MB di personaggi su una macchina che li
; ignora vuol dire pagare quel peso a ogni deploy.
name="Linux Server"
platform="Linux"
runnable=true
advanced_options=true
dedicated_server=true
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="*.png, *.wav, *.glb, *.gltf, *.bin"
export_path="../godot-build/server/ragequit-server"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
; Un formato va scelto anche su un server che non disegna: l'esportatore
; rifiuta il progetto senza. Si prende quello dei desktop e tanto le texture
; sono gia' escluse dal filtro qui sopra.
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
