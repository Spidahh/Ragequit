name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR-validation runs, but NEVER cancel a push to main —
  # that would abort an in-flight Fly.io / Cloudflare deploy mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: quality gate (pnpm check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build shared (declarations needed by client/server)
        run: pnpm --filter=@ragequit/shared build

      # Single source of truth: the same gate developers run locally
      # (typecheck + file-size budget + lint + prettier + content + tests).
      - name: Quality gate (pnpm check)
        run: pnpm check

  build:
    name: build
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}

  deploy-server:
    name: deploy server → Fly.io
    runs-on: ubuntu-latest
    needs: build
    # Only deploy on pushes to main (not PRs).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify public server health
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 15 https://ragequit-server.fly.dev/health; then
              exit 0
            fi
            echo "Health probe $attempt/12 failed; retrying in 5s..."
            sleep 5
          done
          flyctl status --app ragequit-server || true
          flyctl logs --app ragequit-server --no-tail || true
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-client:
    name: deploy client → Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: |
          pnpm --filter=@ragequit/shared build
          pnpm --filter=@ragequit/client build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}

      - name: Publish to Cloudflare Pages
        # Invoke wrangler directly instead of cloudflare/wrangler-action: the
        # action auto-installs wrangler *into the project*, which is impossible
        # here — this is a pnpm workspace using link:/workspace: protocols, so
        # `pnpm add wrangler` fails (ERR_PNPM_ADDING_TO_ROOT) and `npm i wrangler`
        # fails (EUNSUPPORTEDPROTOCOL on link:). `pnpm dlx` runs wrangler in an
        # isolated temp env (Cloudflare's recommended Pages Direct-Upload CI
        # path); as a shell step it has no Node action-runtime deprecation.
        # Keep the established v3 Pages Direct-Upload path pinned so deploy
        # behaviour does not drift independently from application changes.
        run: pnpm dlx wrangler@3 pages deploy packages/client/dist --project-name=ragequit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
